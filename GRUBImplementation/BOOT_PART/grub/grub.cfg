set timeout_style=hidden
set timeout=1

insmod gzio
insmod part_gpt
insmod fat
insmod bli

default=0

# setup vars to be overwritten by load_env
any_ok=0

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

if [ "$B_TRY" -eq 1]; then
    default=1
fi

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}


PLUTO_CMDLINE="ro loglevel=3 nvidia_modeset=1 splash vt.global_cursor_default=0 mem_sleep_default=deep panic=60 sysrq_always_enabled=1 'acpi_osi=!Windows 2020' quiet plymouth.ignore-serial-consoles"

menuentry "PlutoOS Slot A (OK=$A_OK TRY=$A_TRY)" {
    load_video
    set gfxpayload=keep

    search --no-floppy --label --set=root EFIA
    linux /vmlinuz-linux root=LABEL=ROOTA $PLUTO_CMDLINE rauc.slot=A
    initrd /amd-ucode.img /intel-ucode.img /initramfs-linux.img
}

menuentry "PlutoOS Slot B (OK=$B_OK TRY=$B_TRY)" {
    load_video
    set gfxpayload=keep

    search --no-floppy --label --set=root EFIB
    linux /vmlinuz-linux root=LABEL=ROOTB $PLUTO_CMDLINE rauc.slot=B
    initrd /amd-ucode.img /intel-ucode.img /initramfs-linux.img
}

fwsetup --is-supported
if [ "$?" = 0 ]; then
    menuentry 'UEFI Firmware Settings' $menuentry_id_option 'uefi-firmware' {
        fwsetup
    }
fi
